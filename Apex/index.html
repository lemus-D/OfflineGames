<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Apex</title>
<meta name="description" content="Boost a rocket. Scoop gas cans, snag coins, dodge asteroids and black holes." />
<meta name="theme-color" content="#1a2438" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231a2438'/><path fill='%23f0a060' d='M16 4l4 10v10l-4 5-4-5V14z'/><path fill='%23ffe08a' d='M12 24l4 6 4-6z'/></svg>" />
<style>
  :root {
    --ink: #eef2f8;
    --muted: #8a97ae;
    --deep: #070b14;
    --ember: #e07040;
    --flame: #ffc878;
    --fuel: #4fd4a0;
    --hull: #e07070;
    --panel: rgba(8, 14, 26, 0.72);
    --line: rgba(180, 200, 230, 0.18);
    --font-display: "Trebuchet MS", "Verdana", "Geneva", sans-serif;
    --font-body: "Verdana", "Geneva", "Trebuchet MS", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--deep);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  #stage {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    background: #070b14;
    /* Prevent browser upscale blur from looking like motion trails. */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .hidden { display: none !important; }

  .overlay {
    position: fixed; inset: 0;
    display: flex;
    align-items: stretch;
    justify-content: flex-start;
    pointer-events: none;
  }
  .overlay > * { pointer-events: auto; }

  #menu .menu-panel {
    width: min(420px, 92vw);
    max-height: min(92vh, 900px);
    overflow-y: auto;
    margin: clamp(16px, 4vh, 48px) clamp(18px, 4vw, 48px);
    padding: 24px 24px 20px;
    background: linear-gradient(165deg, rgba(18, 28, 48, 0.9), rgba(6, 10, 20, 0.82));
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    align-self: center;
  }

  .brand {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(3rem, 9vw, 4.6rem);
    line-height: 0.95;
    letter-spacing: -0.03em;
    color: var(--flame);
    text-shadow: 0 2px 0 #3a2010, 0 14px 40px rgba(224, 112, 64, 0.35);
    margin: 0 0 8px;
  }
  .tag {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 1.02rem;
    line-height: 1.35;
    max-width: 28ch;
  }

  .btn {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.05rem;
    border: none;
    cursor: pointer;
    padding: 12px 18px;
    color: var(--deep);
    background: var(--flame);
    transition: transform 0.12s, filter 0.12s;
  }
  .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    width: 100%;
    background: linear-gradient(180deg, #ffe0a0, #e07040);
    color: #1a1008;
  }
  .btn.ghost {
    background: transparent;
    color: var(--flame);
    border: 1px solid var(--line);
  }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .meta {
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .meta b { color: var(--ink); }

  .bank {
    margin: 18px 0 8px;
    font-family: var(--font-display);
    font-size: 1.05rem;
    color: var(--flame);
  }
  .bank b { color: #ffe08a; }

  .shop {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 0 0 4px;
    max-height: min(48vh, 340px);
    overflow-y: auto;
  }
  .shop-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 10px;
    align-items: center;
    padding: 8px 10px;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid var(--line);
  }
  .shop-row .name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.98rem;
    color: var(--ink);
  }
  .shop-row .desc {
    grid-column: 1 / -1;
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.3;
  }
  .shop-row .lvl {
    font-size: 0.75rem;
    color: var(--muted);
    text-align: right;
  }
  .shop-row .btn.buy {
    padding: 6px 12px;
    font-size: 0.85rem;
    background: linear-gradient(180deg, #ffe0a0, #e07040);
    color: #1a1008;
  }
  .shop-row .btn.buy:disabled {
    opacity: 0.4;
    cursor: default;
    transform: none;
    filter: none;
  }

  .hint {
    margin: 14px 0 0;
    font-size: 0.8rem;
    color: var(--muted);
  }

  /* —— Cockpit gauges (left stack + right readout) —— */
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    font-family: "Courier New", "Lucida Console", monospace;
  }
  .gauge-stack {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
  }
  .gauge {
    background: linear-gradient(180deg, #1c2436 0%, #0c1018 100%);
    border: 3px solid #6a7388;
    box-shadow: inset 0 0 0 2px #0a0c12, 0 4px 0 #05070c;
    padding: 8px 8px 6px;
    color: #c8d0e0;
  }
  .gauge .g-label {
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    text-align: center;
    color: #8a93a8;
    margin-bottom: 6px;
  }
  .gauge .g-val {
    font-size: 0.95rem;
    font-weight: 700;
    text-align: center;
    color: #e8eef8;
    margin-top: 4px;
    min-width: 4ch;
  }
  .gauge.low .g-val, .gauge.low #fuelFill, .gauge.low #healthFill { color: #ffb454; }

  /* Vertical fuel / hull tanks */
  .fuel-tank, .health-tank {
    width: 28px;
    height: 120px;
    margin: 0 auto;
    background: #05070c;
    border: 2px solid #8a93a8;
    position: relative;
    overflow: hidden;
  }
  .health-tank { height: 88px; width: 24px; }
  .fuel-tank::before, .fuel-tank::after,
  .health-tank::before, .health-tank::after {
    content: "";
    position: absolute;
    left: 2px; right: 2px;
    height: 2px;
    background: #3a4258;
  }
  .fuel-tank::before, .health-tank::before { top: 33%; }
  .fuel-tank::after, .health-tank::after { top: 66%; }
  #fuelFill, #healthFill {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 100%;
    transition: height 0.08s linear;
  }
  #fuelFill {
    background: repeating-linear-gradient(
      180deg,
      #3dcea0 0 3px,
      #2a9a72 3px 6px
    );
  }
  #healthFill {
    background: repeating-linear-gradient(
      180deg,
      #e07070 0 3px,
      #a83838 3px 6px
    );
  }
  .gauge.low #fuelFill {
    background: repeating-linear-gradient(
      180deg,
      #e07040 0 3px,
      #a84820 3px 6px
    );
  }
  .gauge.low #healthFill {
    background: repeating-linear-gradient(
      180deg,
      #ffb454 0 3px,
      #c06020 3px 6px
    );
  }

  /* Velocity bar */
  .vel-meter {
    width: 72px;
    height: 14px;
    margin: 0 auto;
    background: #05070c;
    border: 2px solid #8a93a8;
    position: relative;
    overflow: hidden;
  }
  #velFill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: repeating-linear-gradient(
      90deg,
      #5ab0e0 0 3px,
      #2e6e98 3px 6px
    );
    transition: width 0.06s linear;
  }
  .gauge.falling #velFill {
    background: repeating-linear-gradient(
      90deg,
      #e07040 0 3px,
      #a84820 3px 6px
    );
  }
  .vel-dir {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-align: center;
    color: #8a93a8;
    margin-top: 2px;
    min-height: 1em;
  }

  /* Altitude tape */
  .alt-tape {
    width: 52px;
    height: 120px;
    margin: 0 auto;
    background: #05070c;
    border: 2px solid #8a93a8;
    position: relative;
    overflow: hidden;
  }
  .alt-tape .ticks {
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        180deg,
        transparent 0 9px,
        #3a4258 9px 10px
      );
  }
  .alt-tape .needle {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: 2px;
    background: #fee761;
    box-shadow: 0 0 0 1px #05070c;
    transform: translateY(-50%);
  }
  .alt-tape .needle::before {
    content: "";
    position: absolute;
    left: 0;
    top: -4px;
    border: 5px solid transparent;
    border-left-color: #fee761;
  }

  /* Attitude / tilt dial */
  .tilt-dial {
    width: 72px;
    height: 72px;
    margin: 0 auto;
    border-radius: 50%;
    background: #05070c;
    border: 2px solid #8a93a8;
    position: relative;
    overflow: hidden;
  }
  .tilt-dial .horizon {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #3d5c94 0 50%, #8a3e18 50% 100%);
    transform-origin: center center;
  }
  .tilt-dial .mark {
    position: absolute;
    left: 50%;
    top: 6px;
    width: 2px;
    height: 8px;
    background: #fee761;
    transform: translateX(-50%);
    z-index: 2;
  }
  .tilt-dial .wing {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 36px;
    height: 2px;
    background: #e8eef8;
    transform: translate(-50%, -50%);
    z-index: 2;
  }
  .tilt-dial .wing::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -5px;
    width: 2px;
    height: 10px;
    background: #e8eef8;
    transform: translateX(-50%);
  }

  .hud-right {
    position: absolute;
    right: 14px;
    top: 12px;
    background: linear-gradient(180deg, #1c2436 0%, #0c1018 100%);
    border: 3px solid #6a7388;
    box-shadow: inset 0 0 0 2px #0a0c12, 0 4px 0 #05070c;
    padding: 10px 14px;
    min-width: 120px;
    text-align: right;
  }
  .hud-right .g-label {
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    color: #8a93a8;
  }
  .hud-right b {
    display: block;
    font-size: 1.35rem;
    color: #e8eef8;
    margin: 2px 0 8px;
  }
  .hud-right b:last-child { margin-bottom: 0; }
  .hud-right .next-block { margin-top: 4px; }
  .hud-right .next-name {
    display: block;
    font-size: 1.05rem;
    color: #fee761;
    margin: 2px 0 2px;
  }
  .hud-right .next-dist {
    display: block;
    font-size: 0.85rem;
    color: #c8d0e0;
    margin: 0 0 6px;
  }
  .next-meter {
    width: 100%;
    height: 8px;
    background: #05070c;
    border: 1px solid #6a7388;
    position: relative;
    overflow: hidden;
    margin-bottom: 2px;
  }
  #nextFill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: repeating-linear-gradient(
      90deg,
      #fee761 0 3px,
      #c09020 3px 6px
    );
    transition: width 0.08s linear;
  }

  @media (max-width: 520px) {
    .gauge-stack { left: 6px; gap: 6px; transform: translateY(-50%) scale(0.78); transform-origin: left center; }
    .hud-right { right: 6px; top: 8px; padding: 8px 10px; min-width: 96px; }
    .hud-right b { font-size: 1.1rem; }
  }

  #summary {
    align-items: center;
    justify-content: center;
    background: rgba(4, 8, 16, 0.5);
  }
  .summary-panel {
    width: min(420px, 92vw);
    padding: 28px;
    background: linear-gradient(160deg, rgba(18, 28, 48, 0.94), rgba(6, 10, 20, 0.9));
    border: 1px solid var(--line);
  }
  .summary-panel h2 {
    font-family: var(--font-display);
    margin: 0 0 8px;
    font-size: 2rem;
    color: var(--flame);
  }
  .reason { margin: 0 0 14px; color: var(--muted); }
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .stat-grid div {
    background: rgba(0,0,0,0.25);
    padding: 10px 12px;
    border: 1px solid var(--line);
  }
  .stat-grid span {
    display: block;
    color: var(--muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .stat-grid b { font-family: var(--font-display); font-size: 1.35rem; }
  .muted { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Apex rocket flight"></canvas>

<div id="menu" class="overlay">
  <div class="menu-panel">
    <h1 class="brand">Apex</h1>
    <p class="tag">Climb forever left or right. Watch the hull. Mind the voids.</p>

    <button class="btn primary" id="btnPlay">Launch</button>
    <p class="hint">↑ / W boost · ← → or A / D spin · asteroids chip hull · black holes pull</p>

    <p class="bank">Hangar bank <b id="bankVal">0</b> coins</p>
    <div class="shop" id="shop" aria-label="Upgrades"></div>

    <p class="meta">Best score <b id="bestVal">0</b> · Best altitude <b id="bestAltVal">0</b></p>
    <p class="meta" id="flybyMeta"></p>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="gauge-stack">
    <div class="gauge" id="fuelGauge">
      <div class="g-label">FUEL</div>
      <div class="fuel-tank"><div id="fuelFill"></div></div>
      <div class="g-val" id="fuelVal">100%</div>
    </div>
    <div class="gauge" id="healthGauge">
      <div class="g-label">HULL</div>
      <div class="health-tank"><div id="healthFill"></div></div>
      <div class="g-val" id="healthVal">100%</div>
    </div>
    <div class="gauge">
      <div class="g-label">ALT</div>
      <div class="alt-tape">
        <div class="ticks" id="altTicks"></div>
        <div class="needle"></div>
      </div>
      <div class="g-val" id="altVal">0 km</div>
      <div class="g-label" id="layerVal" style="margin-top:4px;letter-spacing:0.06em">Troposphere</div>
    </div>
    <div class="gauge">
      <div class="g-label">ATT</div>
      <div class="tilt-dial">
        <div class="horizon" id="tiltHorizon"></div>
        <div class="mark"></div>
        <div class="wing"></div>
      </div>
      <div class="g-val" id="tiltVal">0°</div>
    </div>
    <div class="gauge" id="velGauge">
      <div class="g-label">VEL</div>
      <div class="vel-meter"><div id="velFill"></div></div>
      <div class="g-val" id="velVal">0</div>
      <div class="vel-dir" id="velDir">—</div>
    </div>
  </div>
  <div class="hud-right">
    <div class="g-label">SCORE</div>
    <b id="scoreVal">0</b>
    <div class="g-label">COINS</div>
    <b id="coinVal">0</b>
    <div class="g-label">PEAK</div>
    <b id="peakVal">0</b>
    <div class="next-block">
      <div class="g-label">NEXT</div>
      <span class="next-name" id="nextBodyVal">Moon</span>
      <span class="next-dist" id="nextDistVal">—</span>
      <div class="next-meter"><div id="nextFill"></div></div>
    </div>
  </div>
</div>

<div id="summary" class="overlay hidden">
  <div class="summary-panel">
    <h2>Splashdown</h2>
    <div id="summaryBody"></div>
    <div class="btn-row" style="margin-top:18px">
      <button class="btn primary" id="btnAgain" style="flex:1">Launch again</button>
      <button class="btn ghost" id="btnMenu">Menu</button>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
