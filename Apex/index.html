<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Apex</title>
<meta name="description" content="Steer a rocket upward. Scoop fuel, snag coins, dodge meteors." />
<meta name="theme-color" content="#1a2438" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231a2438'/><path fill='%23f0a060' d='M16 4l4 10v10l-4 5-4-5V14z'/><path fill='%23ffe08a' d='M12 24l4 6 4-6z'/></svg>" />
<style>
  :root {
    --ink: #eef2f8;
    --muted: #8a97ae;
    --deep: #070b14;
    --ember: #e07040;
    --flame: #ffc878;
    --fuel: #4fd4a0;
    --panel: rgba(8, 14, 26, 0.72);
    --line: rgba(180, 200, 230, 0.18);
    --font-display: "Trebuchet MS", "Verdana", "Geneva", sans-serif;
    --font-body: "Verdana", "Geneva", "Trebuchet MS", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--deep);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  #stage {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }

  .hidden { display: none !important; }

  .overlay {
    position: fixed; inset: 0;
    display: flex;
    align-items: stretch;
    justify-content: flex-start;
    pointer-events: none;
  }
  .overlay > * { pointer-events: auto; }

  #menu .menu-panel {
    width: min(400px, 92vw);
    margin: clamp(24px, 6vh, 64px) clamp(18px, 4vw, 48px);
    padding: 28px 28px 24px;
    background: linear-gradient(165deg, rgba(18, 28, 48, 0.9), rgba(6, 10, 20, 0.82));
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    align-self: center;
  }

  .brand {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(3rem, 9vw, 4.6rem);
    line-height: 0.95;
    letter-spacing: -0.03em;
    color: var(--flame);
    text-shadow: 0 2px 0 #3a2010, 0 14px 40px rgba(224, 112, 64, 0.35);
    margin: 0 0 8px;
  }
  .tag {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 1.02rem;
    line-height: 1.35;
    max-width: 28ch;
  }

  .btn {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.05rem;
    border: none;
    cursor: pointer;
    padding: 12px 18px;
    color: var(--deep);
    background: var(--flame);
    transition: transform 0.12s, filter 0.12s;
  }
  .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    width: 100%;
    background: linear-gradient(180deg, #ffe0a0, #e07040);
    color: #1a1008;
  }
  .btn.ghost {
    background: transparent;
    color: var(--flame);
    border: 1px solid var(--line);
  }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .meta {
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .meta b { color: var(--ink); }

  .hint {
    margin: 14px 0 0;
    font-size: 0.8rem;
    color: var(--muted);
  }

  #hud {
    position: fixed;
    left: 14px; top: 12px; right: 14px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    pointer-events: none;
    font-size: 0.9rem;
  }
  .hud-block {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 8px 12px;
    backdrop-filter: blur(6px);
    min-width: 140px;
  }
  .hud-block .label {
    color: var(--muted);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .hud-block b { font-family: var(--font-display); font-size: 1.25rem; }
  .fuel {
    margin-top: 6px;
    height: 8px;
    background: rgba(0,0,0,0.35);
    overflow: hidden;
  }
  #fuelFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #1a7a58, var(--fuel));
    transition: width 0.1s linear;
  }
  #fuelFill.low { background: linear-gradient(90deg, var(--ember), var(--flame)); }

  #summary {
    align-items: center;
    justify-content: center;
    background: rgba(4, 8, 16, 0.5);
  }
  .summary-panel {
    width: min(420px, 92vw);
    padding: 28px;
    background: linear-gradient(160deg, rgba(18, 28, 48, 0.94), rgba(6, 10, 20, 0.9));
    border: 1px solid var(--line);
  }
  .summary-panel h2 {
    font-family: var(--font-display);
    margin: 0 0 8px;
    font-size: 2rem;
    color: var(--flame);
  }
  .reason { margin: 0 0 14px; color: var(--muted); }
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .stat-grid div {
    background: rgba(0,0,0,0.25);
    padding: 10px 12px;
    border: 1px solid var(--line);
  }
  .stat-grid span {
    display: block;
    color: var(--muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .stat-grid b { font-family: var(--font-display); font-size: 1.35rem; }
  .muted { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Apex rocket flight"></canvas>

<div id="menu" class="overlay">
  <div class="menu-panel">
    <h1 class="brand">Apex</h1>
    <p class="tag">Fly up. Scoop fuel pockets. Bank coins. Do not kiss the meteors.</p>

    <button class="btn primary" id="btnPlay">Launch</button>
    <p class="hint">Steer with ← → or A / D · fuel runs out, run ends</p>
    <p class="meta">Best score <b id="bestVal">0</b> · Best altitude <b id="bestAltVal">0</b></p>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="hud-block">
    <div class="label">Fuel</div>
    <div class="fuel"><div id="fuelFill"></div></div>
    <div style="margin-top:8px"><span class="label">Coins</span> <b id="coinVal">0</b></div>
  </div>
  <div class="hud-block" style="text-align:right">
    <div class="label">Score</div>
    <b id="scoreVal">0</b>
    <div class="label" style="margin-top:6px">Altitude</div>
    <b id="altVal">0</b>
  </div>
</div>

<div id="summary" class="overlay hidden">
  <div class="summary-panel">
    <h2>Splashdown</h2>
    <div id="summaryBody"></div>
    <div class="btn-row" style="margin-top:18px">
      <button class="btn primary" id="btnAgain" style="flex:1">Launch again</button>
      <button class="btn ghost" id="btnMenu">Menu</button>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
