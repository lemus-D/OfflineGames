<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sharky</title>
<meta name="description" content="Eat, grow, draft upgrades, try not to get eaten. An endless ocean roguelite." />
<meta name="theme-color" content="#06324a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%237eb8c9' d='M4 18c8-10 20-8 24-2-6 2-10 6-14 6-4 0-6-2-10-4z'/><circle cx='10' cy='16' r='1.6' fill='%230a1016'/></svg>" />
<style>
  :root {
    --ink: #e8f4f8;
    --muted: #8eb6c4;
    --deep: #02121d;
    --teal: #1a8a9e;
    --foam: #b7e6f2;
    --coral: #e07a5f;
    --warn: #ffb454;
    --panel: rgba(4, 22, 34, 0.72);
    --line: rgba(140, 200, 220, 0.22);
    /* No networked fonts — PWA must work fully offline (D1). */
    --font-display: "Trebuchet MS", "Verdana", "Geneva", sans-serif;
    --font-body: "Verdana", "Geneva", "Trebuchet MS", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--deep);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  #stage {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: crosshair;
  }

  .hidden { display: none !important; }

  .overlay {
    position: fixed; inset: 0;
    display: flex;
    align-items: stretch;
    justify-content: flex-start;
    pointer-events: none;
  }
  .overlay > * { pointer-events: auto; }

  /* —— Menu: one composition, brand first —— */
  #menu .menu-panel {
    width: min(420px, 92vw);
    margin: clamp(24px, 6vh, 64px) clamp(18px, 4vw, 48px);
    padding: 28px 28px 24px;
    background: linear-gradient(160deg, rgba(6, 40, 58, 0.88), rgba(2, 16, 28, 0.78));
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    align-self: center;
  }

  .brand {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(3rem, 9vw, 4.4rem);
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--foam);
    text-shadow: 0 2px 0 #0a3040, 0 12px 40px rgba(0, 40, 60, 0.55);
    margin: 0 0 8px;
  }
  .tag {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 1.02rem;
    line-height: 1.35;
    max-width: 28ch;
  }

  .section-label {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 8px;
  }

  #animalSelect {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 18px;
  }
  .animal-btn {
    text-align: left;
    background: rgba(10, 40, 55, 0.65);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 12px;
    font: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: border-color 0.15s, transform 0.15s;
  }
  .animal-btn b { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
  .animal-btn span { color: var(--muted); font-size: 0.85rem; }
  .animal-btn:hover:not(:disabled) { border-color: var(--foam); transform: translateX(3px); }
  .animal-btn.selected { border-color: var(--teal); background: rgba(26, 138, 158, 0.22); }
  .animal-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.05rem;
    border: none;
    cursor: pointer;
    padding: 12px 18px;
    color: var(--deep);
    background: var(--foam);
    transition: transform 0.12s, filter 0.12s;
  }
  .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { width: 100%; background: linear-gradient(180deg, #d7f3fb, #8ed0e0); }
  .btn.ghost {
    background: transparent;
    color: var(--foam);
    border: 1px solid var(--line);
  }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .meta {
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .meta b { color: var(--ink); }

  .save-row {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .save-row textarea {
    width: 100%;
    min-height: 44px;
    resize: vertical;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--line);
    color: var(--muted);
    font: 0.75rem/1.3 ui-monospace, Menlo, Consolas, monospace;
    padding: 6px 8px;
  }

  .hint {
    margin: 14px 0 0;
    font-size: 0.8rem;
    color: var(--muted);
  }

  /* —— HUD —— */
  #hud {
    position: fixed;
    left: 14px; top: 12px; right: 14px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    pointer-events: none;
    font-size: 0.9rem;
  }
  .hud-block {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 8px 12px;
    backdrop-filter: blur(6px);
    min-width: 140px;
  }
  .hud-block .label { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .hud-block b { font-family: var(--font-display); font-size: 1.25rem; }
  .hunger {
    margin-top: 6px;
    height: 8px;
    background: rgba(0,0,0,0.35);
    overflow: hidden;
  }
  #hungerFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--teal), var(--foam));
    transition: width 0.1s linear;
  }
  #hungerFill.low { background: linear-gradient(90deg, var(--coral), var(--warn)); }

  /* —— Draft —— */
  #draft {
    align-items: center;
    justify-content: center;
    background: rgba(2, 12, 22, 0.55);
  }
  .draft-inner {
    width: min(720px, 94vw);
    text-align: center;
  }
  .draft-inner h2 {
    font-family: var(--font-display);
    font-size: 2rem;
    margin: 0 0 6px;
    color: var(--foam);
  }
  .draft-inner p { color: var(--muted); margin: 0 0 18px; }
  #draftCards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 640px) {
    #draftCards { grid-template-columns: 1fr; }
  }
  .draft-card {
    background: linear-gradient(165deg, rgba(12, 55, 72, 0.95), rgba(4, 24, 36, 0.95));
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 18px 14px;
    cursor: pointer;
    text-align: left;
    font: inherit;
    transition: border-color 0.15s, transform 0.15s;
  }
  .draft-card:hover {
    border-color: var(--foam);
    transform: translateY(-3px);
  }
  .draft-card b {
    display: block;
    font-family: var(--font-display);
    font-size: 1.2rem;
    margin-bottom: 6px;
  }
  .draft-card span { color: var(--muted); font-size: 0.92rem; }

  /* —— Summary —— */
  #summary {
    align-items: center;
    justify-content: center;
    background: rgba(2, 12, 22, 0.5);
  }
  .summary-panel {
    width: min(420px, 92vw);
    padding: 28px;
    background: linear-gradient(160deg, rgba(6, 40, 58, 0.92), rgba(2, 16, 28, 0.88));
    border: 1px solid var(--line);
  }
  .summary-panel h2 {
    font-family: var(--font-display);
    margin: 0 0 8px;
    font-size: 2rem;
    color: var(--foam);
  }
  .reason { margin: 0 0 14px; color: var(--muted); }
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .stat-grid div {
    background: rgba(0,0,0,0.25);
    padding: 10px 12px;
    border: 1px solid var(--line);
  }
  .stat-grid span { display: block; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .stat-grid b { font-family: var(--font-display); font-size: 1.35rem; }
  .muted { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Sharky ocean"></canvas>

<div id="menu" class="overlay">
  <div class="menu-panel">
    <h1 class="brand">Sharky</h1>
    <p class="tag">Swim free. Eat smaller. Draft wild upgrades. Try not to become lunch.</p>

    <p class="section-label">Animal</p>
    <div id="animalSelect"></div>

    <button class="btn primary" id="btnPlay">Dive in</button>
    <p class="hint">Move with pointer / WASD · hold click or Space to boost</p>
    <p class="meta">Best score <b id="bestVal">0</b></p>

    <div class="save-row">
      <p class="section-label">Save code</p>
      <textarea id="exportBox" placeholder="Export or paste a save code" spellcheck="false"></textarea>
      <div class="btn-row">
        <button class="btn ghost" id="btnExport" type="button">Export</button>
        <button class="btn ghost" id="btnImport" type="button">Import</button>
      </div>
    </div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="hud-block">
    <div class="label">Hunger</div>
    <div class="hunger"><div id="hungerFill"></div></div>
    <div style="margin-top:8px"><span class="label" id="animalLabel">Reef Shark</span></div>
  </div>
  <div class="hud-block" style="text-align:right">
    <div class="label">Score</div>
    <b id="scoreVal">0</b>
    <div class="label" style="margin-top:6px">Mass</div>
    <b id="massVal">1.00</b>
  </div>
</div>

<div id="draft" class="overlay hidden">
  <div class="draft-inner">
    <h2>You grew</h2>
    <p>Pick one upgrade for this run</p>
    <div id="draftCards"></div>
  </div>
</div>

<div id="summary" class="overlay hidden">
  <div class="summary-panel">
    <h2>Run over</h2>
    <div id="summaryBody"></div>
    <div class="btn-row" style="margin-top:18px">
      <button class="btn primary" id="btnAgain" style="flex:1">Swim again</button>
      <button class="btn ghost" id="btnMenu">Menu</button>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
